<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投稿一覧 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" aria-label="メインナビゲーション">
        <a class="brand" th:href="@{/posts}">社内つぶやき</a>
        <nav class="primary-nav">
            <a class="primary-nav__link primary-nav__link--active" th:href="@{/posts}">ホーム</a>
            <a class="primary-nav__link"
               th:href="${searchPerformed} ? @{/posts/new(q=${q})} : @{/posts/new}">投稿する</a>
        </nav>
    </aside>

    <main class="timeline">
        <header class="timeline-header">
            <h1>社内つぶやきボード</h1>
        </header>

        <section class="composer-panel" aria-label="投稿メニュー">
            <form class="search-form" method="get" th:action="@{/posts}">
                <label class="search-form__label" for="post-search">本文検索</label>
                <input id="post-search" type="search" name="q" th:value="${q}" placeholder="キーワード">
                <button type="submit">検索</button>
            </form>
            <div class="composer-panel__actions">
                <form class="reload-form" method="get" th:action="@{/posts/}">
                    <button type="submit">更新</button>
                </form>
                <a class="compose-link"
                   th:href="${searchPerformed} ? @{/posts/new(q=${q})} : @{/posts/new}">新規投稿</a>
            </div>
        </section>

        <section class="feed" aria-label="投稿一覧">
            <p class="empty-state" th:if="${#lists.isEmpty(posts) and searchPerformed}">該当する投稿はありません</p>
            <p class="empty-state" th:if="${#lists.isEmpty(posts) and !searchPerformed}">まだ投稿はありません</p>
            <article class="post" th:each="post : ${posts}">
                <a class="post__link"
                   th:href="${searchPerformed} ? @{/posts/{id}(id=${post.id}, q=${q})} : @{/posts/{id}(id=${post.id})}">
                    <span class="avatar" aria-hidden="true" th:text="${#strings.substring(post.author, 0, 1)}">投</span>
                    <span class="post__content">
                        <span class="post__meta">
                            <span class="post__author" th:text="${post.author}">投稿者</span>
                        </span>
                        <span class="post__body" th:text="${post.body}">本文</span>
                        <time class="post__created-at"
                              th:datetime="${post.createdAt}"
                              th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</time>
                    </span>
                </a>
            </article>
        </section>
    </main>

    <aside class="right-rail" aria-label="補助情報">
        <section class="rail-panel">
            <h2>ボード</h2>
            <p>社内の短い共有を新着順に表示しています。</p>
        </section>
    </aside>
</div>
</body>
</html>
